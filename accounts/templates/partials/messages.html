{% if messages %}
  <div class="app-messages" role="status" aria-live="polite">
    {% for message in messages %}
      <div class="app-message app-message--{{ message.tags|default:'info' }}">
        <span class="app-message__text">{{ message }}</span>
        <button type="button" class="app-message__close" aria-label="Dismiss message">&times;</button>
      </div>
    {% endfor %}
  </div>
{% endif %}
