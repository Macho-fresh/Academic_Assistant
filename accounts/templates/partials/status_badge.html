{% if status == "processed" %}
  <span class="badge badge--success">
    <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1.5 5.8L4 8.3L9.5 2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Processed
  </span>
{% elif status == "processing" %}
  <span class="badge badge--pending">
    <svg width="11" height="11" viewBox="0 0 11 11" fill="none" class="badge__spinner"><circle cx="5.5" cy="5.5" r="4" stroke="currentColor" stroke-width="1.6" stroke-dasharray="16 8"/></svg>
    Processing
  </span>
{% elif status == "failed" %}
  <span class="badge badge--danger">
    <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M2 2L9 9M9 2L2 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    Failed
  </span>
{% else %}
  <span class="badge badge--neutral">{{ status|default:"Unknown" }}</span>
{% endif %}
