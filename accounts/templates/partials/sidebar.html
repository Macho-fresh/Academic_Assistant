<aside class="sidebar" id="sidebar">
  <div class="sidebar__top">
    <a href="{% url 'profile' %}" class="sidebar__brand">
      <span class="sidebar__brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="20" height="20" rx="5" stroke="currentColor" stroke-width="1.6"/>
          <path d="M6 14.5L9 8L12 13L16 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="sidebar__brand-name">Academic Assistant</span>
    </a>
    <button type="button" class="sidebar__close" id="sidebarClose" aria-label="Close navigation menu">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 3L15 15M15 3L3 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <nav class="sidebar__nav" aria-label="Primary">
    <a href="{% url 'dashboard' %}" class="sidebar__link {% if active_nav == 'dashboard' %}is-active{% endif %}">
      <span class="sidebar__icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="6" height="6" rx="1.4" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="2" width="6" height="6" rx="1.4" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="10" width="6" height="6" rx="1.4" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="10" width="6" height="6" rx="1.4" stroke="currentColor" stroke-width="1.5"/></svg>
      </span>
      Dashboard
    </a>
    <a href="{% url 'lectures' %}" class="sidebar__link {% if active_nav == 'lectures' %}is-active{% endif %}">
      <span class="sidebar__icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.5"/><path d="M9 5.5V9L11.5 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </span>
      My Lectures
    </a>
    <a href="{% url 'courses' %}" class="sidebar__link {% if active_nav == 'courses' %}is-active{% endif %}">
      <span class="sidebar__icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 4.5L9 2L16 4.5L9 7L2 4.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M4.5 6V11C4.5 12.5 6.5 14 9 14C11.5 14 13.5 12.5 13.5 11V6" stroke="currentColor" stroke-width="1.5"/></svg>
      </span>
      Courses
    </a>
    <a href="{% url 'timetable' %}" class="sidebar__link {% if active_nav == 'timetable' %}is-active{% endif %}">
      <span class="sidebar__icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="3" width="14" height="12" rx="1.6" stroke="currentColor" stroke-width="1.5"/><path d="M2 7H16" stroke="currentColor" stroke-width="1.5"/><path d="M6 1.6V4M12 1.6V4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </span>
      Timetable
    </a>
    <a href="{% url 'profile' %}" class="sidebar__link {% if active_nav == 'profile' %}is-active{% endif %}">
      <span class="sidebar__icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="9" cy="6" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M3 15C3 12 5.5 10.5 9 10.5C12.5 10.5 15 12 15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </span>
      Profile
    </a>
  </nav>

  <div class="sidebar__bottom">
    <form action="{% url 'logout' %}" method="post" class="sidebar__logout-form">
      {% csrf_token %}
      <button type="submit" class="sidebar__link sidebar__link--logout">
        <span class="sidebar__icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 2.5H4C3.17 2.5 2.5 3.17 2.5 4V14C2.5 14.83 3.17 15.5 4 15.5H7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M11.5 12.5L15 9L11.5 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 9H15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </span>
        Log out
      </button>
    </form>

    <div class="sidebar__user">
      <span class="sidebar__avatar" aria-hidden="true">{{ user.first_name|default:"M"|first|upper }}</span>
      <span class="sidebar__user-meta">
        <span class="sidebar__user-name">{{ user.first_name|default:"Michael" }}</span>
        <span class="sidebar__user-role">{{ user.get_role_display|default:"Student" }}</span>
      </span>
    </div>
  </div>
</aside>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
