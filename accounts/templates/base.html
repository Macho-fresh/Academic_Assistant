{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Academic Assistant{% endblock %}</title>

  <!-- Fonts: Source Serif 4 for headings, Inter for UI/body -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'accounts/css/base.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

  {% include "partials/messages.html" %}

  {% block content %}{% endblock %}

  <script>
    document.querySelectorAll(".app-message__close").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var msg = btn.closest(".app-message");
        if (msg) msg.remove();
      });
    });
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
